<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سرآغاز</title>
<meta name="description" content="در آستانه‌ی دگرگونی‌ای شگرف… این، تنها سرآغاز است. به‌زودی.">
<meta name="theme-color" content="#eef3fb">
<style>
  @font-face { font-family: Vazirmatn; src: url('fonts/Vazirmatn.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
  :root { --bg: #eef3fb; --navy: #1b2a6b; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--navy); font-family: Vazirmatn, Tahoma, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; background:
    radial-gradient(40% 50% at 15% 20%, rgba(59,108,246,.35), transparent 70%), radial-gradient(40% 50% at 85% 20%, rgba(47,208,160,.3), transparent 70%),
    radial-gradient(40% 50% at 20% 85%, rgba(155,107,255,.3), transparent 70%), radial-gradient(40% 50% at 85% 85%, rgba(255,154,60,.3), transparent 70%), var(--bg); }
  canvas#c { width: 100vw; max-width: calc(100dvh * 16 / 9); aspect-ratio: 16 / 9; display: block; border-radius: 14px; box-shadow: 0 30px 80px rgba(27,42,107,.18); }
  .ui { position: fixed; inset: 0; display: grid; place-items: center; z-index: 5; transition: opacity .6s; }
  .ui.hide { opacity: 0; pointer-events: none; }
  .btn { font: inherit; font-weight: 700; font-size: 17px; color: #fff; border: 0; border-radius: 999px; padding: 14px 34px; cursor: pointer; text-decoration: none; display: inline-flex; gap: 10px; align-items: center;
    background: linear-gradient(90deg, #2f6bff, #8b5cf6, #ff8a3d); box-shadow: 0 10px 30px rgba(91,92,246,.35); transition: transform .2s; }
  .btn:hover { transform: translateY(-2px); }
  .btn.ghost { background: rgba(255,255,255,.75); color: var(--navy); box-shadow: 0 6px 20px rgba(27,42,107,.12); backdrop-filter: blur(8px); font-size: 15px; padding: 10px 22px; }
  .card { text-align: center; } .card p { margin-top: 14px; font-size: 13px; opacity: .7; }
  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  #end { place-items: end center; padding-bottom: max(24px, env(safe-area-inset-bottom)); }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div class="ui" id="start"><div class="card"><button class="btn" id="play">▶&nbsp; پخش</button><p>با صدا تماشا کنید</p></div></div>
<div class="ui hide" id="end"><div class="row"><button class="btn ghost" id="replay">↻ پخش دوباره</button><a class="btn ghost" href="teaser6/teaser.mp4" download="kanon-sarAghaz.mp4">دانلود ویدیو</a></div></div>
<audio id="music" src="teaser6/teaser-music.mp3" preload="auto"></audio>

<script>
(() => {
'use strict';
// timeline (هماهنگ با scripts/teaser/make-music-6.py): ۱۲۰ BPM، هر صحنه ۴ ثانیه، دراپ در ۲۶
const BEAT = .5, DUR = 38, W = 1920, H = 1080, CX = W / 2, CY = H / 2;
const T = { orbit: 20, ready: 24, drop: 26, soon: 30, end: 34 };
const NAVY = '#1b2a6b', BLUE = '#3b6cf6', GREEN = '#2fd0a0', PURPLE = '#9b6bff', ORANGE = '#ff9a3c';
const SHOTS = ['home', 'study', 'path', 'games', 'results', 'roadmap', 'profile', 'library', 'birthday'];
const IMG = Object.fromEntries(SHOTS.map(n => { const i = new Image(); i.src = `teaser6/screens/${n}.webp`; return [n, i]; }));
const logo = new Image(); logo.src = 'img/logo-ashtiani.png';

const SCENES = [   // phone side: 1 = left, -1 = right
  { a: 'در آستانه‌ی', b: 'دگرگونی‌ای شگرف', shot: null, side: 0 },
  { a: 'آنجا که تمرکز', b: 'به هنری ناب بدل می‌شود', shot: 'study', side: 1 },
  { a: 'و مسیر تعالی', b: 'هوشمندانه ترسیم می‌گردد', shot: 'path', side: -1 },
  { a: 'دانش، بازی و داستان', b: 'در هم می‌آمیزند', shot: 'games', side: 1 },
  { a: 'هر کوشش', b: 'ردّی از افتخار بر جای می‌نهد', shot: 'results', side: -1 },
];

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const win = (t, a, b, fi = .5, fo = .4) => Math.min(lin(t, a, a + fi), 1 - lin(t, b - fo, b));
const beatPulse = t => (t >= 4 && t < 24) || (t >= T.drop && t < T.end) ? Math.exp(-((t % BEAT)) * 8) : 0;

// ---------- background: aurora blobs + floor lines + glass cards ----------
const BLOBS = [[BLUE, .18, .2, 520], [GREEN, .82, .18, 480], [PURPLE, .2, .82, 460], [ORANGE, .84, .8, 500], [PURPLE, .55, .1, 300], [BLUE, .6, .95, 320]];
function aurora(t, energy) {
  const c = ctx; c.fillStyle = '#eef3fb'; c.fillRect(0, 0, W, H);
  BLOBS.forEach(([col, x, y, r], i) => {
    const px = x * W + Math.sin(t * .25 + i * 2) * 90, py = y * H + Math.cos(t * .2 + i) * 60, rr = r * (1 + energy * .15);
    const g = c.createRadialGradient(px, py, 0, px, py, rr); g.addColorStop(0, col + 'b0'); g.addColorStop(.45, col + '55'); g.addColorStop(1, col + '00');
    c.fillStyle = g; c.fillRect(px - rr, py - rr, rr * 2, rr * 2);
  });
  const w = c.createRadialGradient(CX, CY, 0, CX, CY, 700); w.addColorStop(0, 'rgba(255,255,255,.55)'); w.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = w; c.fillRect(0, 0, W, H);
  // perspective floor lines
  c.save(); c.strokeStyle = 'rgba(27,42,107,.10)'; c.lineWidth = 1.5;
  const hy = 610; c.beginPath(); c.moveTo(0, hy); c.lineTo(W, hy); c.stroke();
  for (let i = -8; i <= 8; i++) { c.beginPath(); c.moveTo(CX + i * 40, hy); c.lineTo(CX + i * 420, H); c.stroke(); }
  for (let k = 1; k < 5; k++) { const y = hy + Math.pow(k / 5, 1.8) * (H - hy) + ((t * 30) % 40) * k / 5; c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
  c.restore();
}
const CARDS = Array.from({ length: 16 }, (_, i) => ({ x: hash(i) * W, y: hash(i + 30) * H, w: 160 + hash(i + 7) * 220, h: 110 + hash(i + 9) * 150, r: (hash(i + 11) - .5) * .7, d: .3 + hash(i + 13) * .9, col: [BLUE, GREEN, PURPLE, ORANGE][i % 4] }));
function cards(t, speed = 1) {
  const c = ctx;
  CARDS.forEach((k, i) => {
    const drift = t * 18 * k.d * speed, x = ((k.x + drift + Math.sin(t * .4 + i) * 30) % (W + 400)) - 200, y = k.y + Math.sin(t * .5 + i * 1.7) * 25;
    c.save(); c.translate(x, y); c.rotate(k.r + Math.sin(t * .3 + i) * .05); c.globalAlpha = .55 + .25 * k.d;
    c.fillStyle = 'rgba(255,255,255,.38)'; c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 2;
    c.beginPath(); c.roundRect(-k.w / 2, -k.h / 2, k.w, k.h, 22); c.fill(); c.stroke();
    c.fillStyle = k.col; c.globalAlpha *= .8; c.beginPath(); c.arc(-k.w / 2 + 26, -k.h / 2 + 26, 9, 0, 7); c.fill();
    c.strokeStyle = k.col; c.globalAlpha *= .5; c.lineWidth = 4; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-k.w / 2 + 50, -k.h / 2 + 22); c.lineTo(k.w / 2 - 24, -k.h / 2 + 22); c.moveTo(-k.w / 2 + 50, -k.h / 2 + 36); c.lineTo(k.w / 2 - 70, -k.h / 2 + 36); c.stroke();
    c.restore();
  });
}
function orb(x, y, r, t, a = 1) {
  if (a <= 0 || r <= 0) return;
  const c = ctx; c.save(); c.globalAlpha = a;
  const g = c.createRadialGradient(x, y, 0, x, y, r * 3.2);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.12, 'rgba(255,255,255,.95)'); g.addColorStop(.22, 'rgba(90,209,255,.9)'); g.addColorStop(.45, 'rgba(91,108,246,.45)'); g.addColorStop(.7, 'rgba(155,107,255,.18)'); g.addColorStop(1, 'rgba(155,107,255,0)');
  c.fillStyle = g; c.fillRect(x - r * 3.2, y - r * 3.2, r * 6.4, r * 6.4);
  c.restore();
}
function rings(x, y, t, a = 1, s = 1) {
  if (a <= 0) return;
  const c = ctx; c.save(); c.globalAlpha = a; c.translate(x, y);
  [[520, 170, .2, '#d9a441'], [380, 380, -.1, '#5ad1ff'], [600, 240, -.35, '#9b6bff']].forEach(([rx, ry, rot, col], i) => {
    c.save(); c.rotate(rot + t * (i % 2 ? -.05 : .04)); c.strokeStyle = col; c.globalAlpha = a * .55; c.lineWidth = 2.5;
    c.beginPath(); c.ellipse(0, 0, rx * s, ry * s, 0, 0, 7); c.stroke();
    const an = t * (.6 + i * .2); c.fillStyle = col; c.globalAlpha = a; c.beginPath(); c.arc(Math.cos(an) * rx * s, Math.sin(an) * ry * s, 7, 0, 7); c.fill();
    c.restore(); });
  c.restore();
}

// ---------- phone mockup with blurred real screens ----------
function phone(name, x, y, h, o = {}) {
  const img = IMG[name], c = ctx, w = h * .462, a = o.a ?? 1; if (a <= 0) return;
  c.save(); c.globalAlpha = a; c.translate(x, y); c.rotate(o.rot || 0);
  const yaw = o.yaw || 0; c.transform(Math.cos(yaw), Math.sin(yaw) * .12, 0, 1, 0, 0);
  // shadow
  c.save(); c.shadowColor = 'rgba(27,42,107,.28)'; c.shadowBlur = h * .08; c.shadowOffsetY = h * .04;
  c.fillStyle = '#f7f9ff'; c.beginPath(); c.roundRect(-w / 2, -h / 2, w, h, w * .17); c.fill(); c.restore();
  c.strokeStyle = 'rgba(140,160,220,.65)'; c.lineWidth = Math.max(2, h * .006); c.beginPath(); c.roundRect(-w / 2, -h / 2, w, h, w * .17); c.stroke();
  const i = h * .022; c.save(); c.beginPath(); c.roundRect(-w / 2 + i, -h / 2 + i, w - 2 * i, h - 2 * i, w * .14); c.clip();
  if (img.complete && img.naturalWidth) { const b = o.blur ?? 6; if (b > .3) c.filter = `blur(${b * h / 800}px)`; c.drawImage(img, -w / 2 + i, -h / 2 + i, w - 2 * i, h - 2 * i); c.filter = 'none'; }
  c.fillStyle = 'rgba(255,255,255,.18)'; c.fillRect(-w / 2, -h / 2, w, h);
  // glass sweep
  const s = ((o.t || 0) * .35 + (o.seed || 0)) % 1.8 - .4;
  const g = c.createLinearGradient(-w / 2 + w * s * 2 - w * .4, -h / 2, -w / 2 + w * s * 2 + w * .4, -h / 2 + h * .35);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = g; c.fillRect(-w / 2, -h / 2, w, h);
  c.restore();
  c.fillStyle = 'rgba(30,35,60,.85)'; c.beginPath(); c.roundRect(-w * .17, -h / 2 + h * .03, w * .34, h * .036, h * .018); c.fill();
  c.restore();
}

// ---------- typography ----------
function grad(c, x, w, cols) { const g = c.createLinearGradient(x + w / 2, 0, x - w / 2, 0); cols.forEach((col, i) => g.addColorStop(i / (cols.length - 1), col)); return g; }
function text(s, x, y, size, p, o = {}) {
  if (p <= 0 || !s) return;
  const c = ctx; c.save();
  c.font = `${o.weight || 400} ${size}px Vazirmatn`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.direction = 'rtl';
  const w = c.measureText(s).width, k = eo(clamp(p));
  // soft right→left wipe
  const edge = x + w / 2 + 40 - (w + 160) * k;
  const m = c.createLinearGradient(edge, 0, edge + 120, 0);
  c.globalAlpha = clamp(p * 1.5) * (o.alpha ?? 1);
  if (k < 1) c.filter = `blur(${(1 - k) * 8}px)`;
  c.translate(0, (1 - k) * 18);
  c.beginPath(); c.rect(edge, y - size, W, size * 2); c.clip();
  c.fillStyle = o.grad ? grad(c, x, w, o.grad) : (o.col || NAVY);
  if (o.glow) { c.shadowColor = 'rgba(255,255,255,.9)'; c.shadowBlur = 30; }
  c.fillText(s, x, y);
  c.restore();
}
const G1 = ['#2f6bff', '#8b5cf6', '#ff8a3d'], G2 = ['#18b88a', '#2f6bff', '#8b5cf6', '#ff8a3d'];

// ---------- scenes ----------
function sceneIntro(t) {
  const r = 30 + eo(lin(t, .2, 3.4)) * 70 + beatPulse(t) * 10 + Math.max(0, Math.sin(t * Math.PI * 2 - 1)) * 6 * (t < 4);
  rings(CX, CY + 30, t, eo(lin(t, .3, 1.8)) * (1 - lin(t, 3.6, 4)), .7 + t * .05);
  orb(CX, CY + 30, r, t, eo(lin(t, 0, 1)) * (1 - lin(t, 3.6, 4)));
  text(SCENES[0].a, CX, 300, 64, win(t, 1.0, 4, .7, .4), { weight: 400 });
  text(SCENES[0].b, CX, 400, 104, win(t, 1.6, 4, .8, .4), { weight: 900, grad: G1 });
}
function sceneFeature(t, k) {
  const sc = SCENES[k], p = t - k * 4, side = sc.side;
  const inP = eo(lin(p, 0, .8)), outP = eio(lin(p, 3.45, 4));
  const px = CX - side * 430 + side * (1 - inP) * -260 + side * outP * -120, py = CY + 20 + (1 - inP) * 160 - outP * 80 + Math.sin(t * 1.2) * 10;
  const yaw = side * (.35 - .2 * inP + Math.sin(t * .8) * .04), rot = side * -.06 + Math.sin(t * .7) * .015;
  // secondary phone, farther & blurrier
  const second = SHOTS[(SHOTS.indexOf(sc.shot) + 4) % SHOTS.length];
  phone(second, px - side * 230, py + 60, 600, { a: inP * (1 - outP) * .55, yaw: yaw * 1.3, rot: rot * 1.5 + side * -.08, blur: 14, t, seed: k + .5 });
  phone(sc.shot, px, py, 860 * (1 + p * .015), { a: inP * (1 - outP), yaw, rot, blur: 5.5, t, seed: k });
  const tx = CX + side * 380;
  text(sc.a, tx, 420, 60, win(p, .45, 4, .7, .45), { weight: 400 });
  text(sc.b, tx, 520, sc.b.length > 18 ? 76 : 88, win(p, .9, 4, .8, .45), { weight: 900, grad: G1 });
  // index chip
  const ca = win(p, .3, 4, .4, .4); if (ca > 0) { const c = ctx; c.save(); c.globalAlpha = ca * .9; c.fillStyle = 'rgba(255,255,255,.7)'; c.beginPath(); c.roundRect(tx - 70, 320, 140, 46, 23); c.fill();
    c.fillStyle = NAVY; c.font = '700 24px Vazirmatn'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.direction = 'rtl'; c.fillText(`۰${'۱۲۳۴'[k - 1]} / ۰۴`, tx, 344); c.restore(); }
}
function sceneOrbit(t) {
  const p = t - T.orbit, n = 8, items = [];
  const zoom = 1 + (t > T.ready ? eio(lin(t, T.ready, T.drop)) * .9 : 0);
  for (let i = 0; i < n; i++) { const an = i / n * Math.PI * 2 + p * (.45 + (t > T.ready ? (t - T.ready) * .8 : 0)); items.push({ i, an, z: Math.sin(an) }); }
  items.sort((a, b) => a.z - b.z);
  const draw = (it) => { const s = (it.z + 2.2) / 3.2, x = CX + Math.cos(it.an) * 700 * zoom, y = CY + 40 + it.z * 170 * zoom;
    phone(SHOTS[it.i % SHOTS.length], x, y, 420 * s * zoom, { a: eo(lin(p, it.i * .08, .6 + it.i * .08)) * (1 - lin(t, 25.6, 25.75)), yaw: -Math.cos(it.an) * .5, rot: -Math.cos(it.an) * .08, blur: 4 + (1 - s) * 12, t, seed: it.i }); };
  rings(CX, CY + 40, t, eo(lin(p, 0, 1)) * (1 - lin(t, 25.5, 25.75)), zoom * .9);
  items.filter(it => it.z < 0).forEach(draw);
  orb(CX, CY + 40, (60 + beatPulse(t) * 14) * zoom, t, 1 - lin(t, 25.6, 25.75));
  items.filter(it => it.z >= 0).forEach(draw);
  text('تجربه‌ای بی‌بدیل', CX, 150, 64, win(t, 20.3, 24, .6, .3), { weight: 400 });
  text('از جنس آینده', CX, 250, 100, win(t, 20.8, 24, .7, .3), { weight: 900, grad: G1 });
  const rs = back(lin(t, 24.15, 24.6));
  if (t >= 24.1 && t < 25.75) { ctx.save(); ctx.translate(CX, 200); ctx.scale(rs, rs); text('آماده‌ای؟', 0, 0, 150, 1, { weight: 900, grad: ['#ff8a3d', '#8b5cf6', '#2f6bff'], glow: true }); ctx.restore(); }
  if (t >= 25.75) { ctx.fillStyle = `rgba(238,243,251,${lin(t, 25.75, 25.8)})`; ctx.fillRect(0, 0, W, H); }
}
const FAN = [[-650, -250, .8, -.15], [-420, 190, 1, -.08], [-180, -300, .7, .1], [180, -310, .72, -.1], [430, 200, 1, .08], [660, -240, .8, .14], [0, 240, .9, 0], [-760, 150, .6, -.2], [770, 170, .62, .2]];
function sceneDrop(t) {
  const p = t - T.drop;
  // burst flash
  ctx.fillStyle = `rgba(255,255,255,${Math.max(0, .95 - p * 1.6)})`;
  orb(CX, CY, 120 + Math.max(0, 1 - p) * 300 + beatPulse(t) * 20, t, 1 - lin(t, T.end - .2, T.end + .6) * .5);
  rings(CX, CY, t, eo(lin(p, 0, .8)), 1.2 + p * .05);
  const spread = eo(lin(p, 0, 1.0)), away = eio(lin(t, T.soon, T.soon + 1.2));
  FAN.forEach(([dx, dy, s, r], i) => {
    const x = CX + dx * spread * (1 + away * .5), y = CY + dy * spread * (1 + away * .4) + Math.sin(t * 1.5 + i) * 10;
    phone(SHOTS[(i + 2) % SHOTS.length], x, y, 380 * s, { a: spread * (1 - away * .75), rot: r + Math.sin(t + i) * .03, yaw: dx / 2000, blur: 3.5 + away * 10, t, seed: i });
  });
  ctx.fillStyle = `rgba(255,255,255,${Math.max(0, .9 - p * 1.8)})`; ctx.fillRect(0, 0, W, H);
  // «این، تنها سرآغاز است…»
  const tw = win(t, T.drop + .2, T.soon + .1, .6, .4);
  if (tw > 0) { ctx.save(); ctx.fillStyle = `rgba(255,255,255,${.55 * tw})`; ctx.beginPath(); ctx.roundRect(CX - 560, CY - 130, 1120, 260, 60); ctx.fill(); ctx.restore(); }
  text('این، تنها', CX, CY - 50, 72, win(t, T.drop + .2, T.soon + .1, .5, .4), { weight: 400 });
  text('سرآغاز است…', CX, CY + 50, 118, win(t, T.drop + .7, T.soon + .1, .6, .4), { weight: 900, grad: G2 });
  // «به‌زودی»
  if (t >= T.soon) {
    const q = t - T.soon, s = back(lin(q, 0, .5));
    ctx.save(); ctx.translate(CX, CY - 20); ctx.scale(.9 + .1 * s, .9 + .1 * s);
    text('به‌زودی', 0, 0, 260, lin(q, 0, .5), { weight: 900, grad: G2, glow: true }); ctx.restore();
    text('نسل تازه‌ی یادگیری، در دستان تو', CX, CY + 170, 56, lin(q, .8, 1.6), { weight: 500 });
  }
}
function sceneEnd(t) {
  const p = t - T.end;
  ctx.fillStyle = `rgba(255,255,255,${Math.max(0, .9 - p * 2)})`;
  orb(CX, 330, 70 + beatPulse(t) * 8, t, 1);
  rings(CX, 330, t, 1, .6);
  const la = eo(lin(p, .1, .8));
  if (la > 0 && logo.complete && logo.naturalWidth) { const c = ctx; c.save(); c.globalAlpha = la; c.shadowColor = 'rgba(27,42,107,.2)'; c.shadowBlur = 40; c.fillStyle = '#fff'; c.beginPath(); c.arc(CX, 330, 120, 0, 7); c.fill(); c.shadowColor = 'transparent';
    c.beginPath(); c.arc(CX, 330, 112, 0, 7); c.clip(); c.drawImage(logo, CX - 100, 230, 200, 200); c.restore(); }
  text('به‌زودی', CX, 610, 200, 1, { weight: 900, grad: G2 });
  text('کانون نخبه‌پروری شهید کاظمی آشتیانی', CX, 790, 50, lin(p, .5, 1.3), { weight: 600 });
  text('منتظر باش…', CX, 880, 42, lin(p, 1.2, 2.0), { weight: 400, col: '#5b6aa6' });
  ctx.fillStyle = `rgba(255,255,255,${Math.max(0, .9 - p * 2.2)})`; ctx.fillRect(0, 0, W, H);
  if (t > DUR - 1.2) { ctx.fillStyle = `rgba(238,243,251,${lin(t, DUR - 1.2, DUR)})`; ctx.fillRect(0, 0, W, H); }
}

function render(t) {
  t = clamp(t, 0, DUR);
