<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>کلاس آنلاین (نمایشی) | پلتفرم رشد نخبه</title>
<style>
@font-face { font-family: Vazirmatn; src: url('/fonts/Vazirmatn.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
:root { --bg: #0f1b24; --panel: #16262f; --line: #26404b; --ink: #eaf4f4; --muted: #8fb0b3; --brand: #1fa5a0; --amber: #f2b33d; --red: #e5584d; --green: #3fb27f; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: Vazirmatn, Tahoma, sans-serif; background: var(--bg); color: var(--ink); display: grid; grid-template-rows: auto auto 1fr auto; font-size: 14px; }
.demo-strip { background: var(--amber); color: #3a2706; text-align: center; font-weight: 800; font-size: 12.5px; padding: 5px 10px; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 15px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header small { color: var(--muted); display: block; font-weight: 500; font-size: 12px; }
.live { display: inline-flex; align-items: center; gap: 6px; background: #e5584d22; color: #ff8a80; border: 1px solid #e5584d66; border-radius: 99px; padding: 2px 10px; font-weight: 800; font-size: 12px; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.timer { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 700; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 12px; padding: 12px; min-height: 0; }
.stage { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 12px; min-height: 0; }
.board-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 12px; min-height: 0; }
.board { background: #fbfdfc; border-radius: 14px; position: relative; overflow: hidden; border: 1px solid var(--line); min-height: 280px; }
.board svg { width: 100%; height: 100%; display: block; }
.board .tag { position: absolute; top: 10px; inset-inline-start: 10px; background: #0f1b24cc; color: #fff; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; }
.tile { position: relative; border-radius: 14px; background: linear-gradient(160deg, #1d3a45, #122630); border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; }
.tile .av { width: 64px; height: 64px; border-radius: 50%; background: #2a5360; display: grid; place-items: center; font-size: 26px; font-weight: 800; }
.tile.teacher { aspect-ratio: 4/3; }
.tile.teacher .av { width: 84px; height: 84px; font-size: 34px; background: var(--brand); }
.tile .nm { position: absolute; bottom: 8px; inset-inline-start: 8px; background: #0b141acc; padding: 2px 9px; border-radius: 8px; font-size: 12px; font-weight: 700; display: flex; gap: 6px; align-items: center; }
.tile .speak { position: absolute; inset: 0; border: 2px solid var(--green); border-radius: 14px; opacity: 0; }
.tile.on .speak { opacity: 1; }
.side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.grid .tile { aspect-ratio: 4/3; }
.grid .tile .av { width: 40px; height: 40px; font-size: 16px; }
.chat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; min-height: 0; flex: 1; }
.chat h2 { margin: 0; padding: 10px 14px; font-size: 14px; border-bottom: 1px solid var(--line); }
.msgs { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; min-height: 160px; }
.m b { display: block; font-size: 11.5px; color: var(--muted); }
.m span { display: inline-block; background: #20384300; background: #203843; border-radius: 10px; padding: 5px 10px; margin-top: 2px; line-height: 1.7; }
.m.me span { background: #1b6f6c; }
.chat form { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--line); }
.chat input { flex: 1; min-width: 0; background: #0f1b24; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; }
.btn { border: 0; border-radius: 10px; padding: 8px 14px; font: inherit; font-weight: 700; cursor: pointer; background: var(--brand); color: #04201f; }
.hands { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; font-size: 13px; color: var(--muted); }
.hands b { color: var(--ink); }
footer { display: flex; justify-content: center; gap: 10px; padding: 10px; border-top: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
footer button { display: inline-flex; align-items: center; gap: 7px; background: #1f3844; color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px; font: inherit; font-weight: 700; cursor: pointer; }
footer button[aria-pressed="true"] { background: var(--brand); color: #04201f; border-color: var(--brand); }
footer button.leave { background: var(--red); border-color: var(--red); color: #fff; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } .board-wrap { grid-template-columns: 1fr; } .grid { grid-template-columns: repeat(3, 1fr); } .side { flex-direction: column; } body { grid-template-rows: auto auto auto auto; } }
</style>
</head>
<body>
<div class="demo-strip">نمایش آموزشی (دمو): این صفحه فقط برای معرفی محیط کلاس آنلاین است و ارتباط صوتی یا تصویری واقعی ندارد.</div>
<header>
  <h1 id="title">ریاضی: کسرها و اعداد اعشاری<small>خانم احمدی · پایه ششم</small></h1>
  <span class="live"><i></i> زنده</span><span class="timer" id="timer">۰۰:۰۰</span>
</header>
<main>
  <div class="stage">
    <div class="board-wrap">
      <div class="board"><span class="tag">تخته</span>
        <svg viewBox="0 0 640 380" aria-label="تخته با نمونهٔ حل مسئله کسر">
          <text x="320" y="48" text-anchor="middle" font-size="26" fill="#0f3b3a" font-weight="700">جمع کسرها با مخرج‌های مختلف</text>
          <g font-size="34" fill="#17384a" text-anchor="middle" font-family="Vazirmatn, sans-serif">
            <text x="150" y="130">۱</text><line x1="130" y1="140" x2="170" y2="140" stroke="#17384a" stroke-width="3"/><text x="150" y="176">۲</text>
            <text x="205" y="150">+</text>
            <text x="260" y="130">۱</text><line x1="240" y1="140" x2="280" y2="140" stroke="#17384a" stroke-width="3"/><text x="260" y="176">۳</text>
            <text x="315" y="150">=</text>
            <text x="370" y="130">۳</text><line x1="350" y1="140" x2="390" y2="140" stroke="#e5584d" stroke-width="3"/><text x="370" y="176">۶</text>
            <text x="425" y="150">+</text>
            <text x="480" y="130">۲</text><line x1="460" y1="140" x2="500" y2="140" stroke="#e5584d" stroke-width="3"/><text x="480" y="176">۶</text>
            <text x="535" y="150">=</text>
            <text x="590" y="130" fill="#12805c">۵</text><line x1="570" y1="140" x2="610" y2="140" stroke="#12805c" stroke-width="3"/><text x="590" y="176" fill="#12805c">۶</text>
          </g>
          <rect x="60" y="215" width="250" height="26" rx="6" fill="#e3f1f1"/><rect x="310" y="215" width="130" height="26" rx="6" fill="#f4c27a"/>
          <text x="185" y="234" text-anchor="middle" font-size="14" fill="#0f3b3a">یک‌دوم = ۳ از ۶ قسمت</text><text x="375" y="234" text-anchor="middle" font-size="14" fill="#6b4a0c">یک‌سوم = ۲ از ۶</text>
          <path d="M70 300 q60 -40 120 0 t120 0 t120 0" stroke="#1fa5a0" stroke-width="3" fill="none" stroke-linecap="round"/>
          <text x="320" y="350" text-anchor="middle" font-size="18" fill="#52707a">اول مخرج مشترک می‌گیریم، بعد صورت‌ها را جمع می‌کنیم</text>
        </svg>
      </div>
      <div class="tile teacher on" id="teacher"><span class="speak"></span><div class="av">ا</div><span class="nm">خانم احمدی · معلم</span></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <aside class="side">
    <div class="hands" id="hands">دست‌های بالا: <b id="handCount">۱</b> نفر · <span id="handWho">سارا</span></div>
    <section class="chat" aria-label="گفت‌وگو">
      <h2>گفت‌وگوی کلاس</h2>
      <div class="msgs" id="msgs"></div>
      <form id="form"><input id="msg" placeholder="پیام خود را بنویسید…" aria-label="پیام" autocomplete="off"><button class="btn">ارسال</button></form>
    </section>
  </aside>
</main>
<footer>
  <button aria-pressed="true" data-t><svg class="i" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg> میکروفون</button>
  <button aria-pressed="true" data-t><svg class="i" viewBox="0 0 24 24"><path d="m16 13 5.2 3.2a.5.5 0 0 0 .8-.4V8.2a.5.5 0 0 0-.8-.4L16 11"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg> دوربین</button>
  <button aria-pressed="false" data-t id="hand"><svg class="i" viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 0 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-5.9-2.4L3.4 16a2 2 0 0 1 3.2-2.4L8 15"/></svg> بالا بردن دست</button>
  <button aria-pressed="false" data-t><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg> واکنش</button>
  <button class="leave" id="leave"><svg class="i" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg> خروج از کلاس</button>
</footer>
<script>
const names = ['سارا', 'علی', 'مهدیس', 'امیر', 'نگار', 'پارسا', 'ریحانه', 'آرین', 'ستایش', 'کیان', 'هانیه', 'آیدا'];
const fa = (n) => String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
document.getElementById('grid').innerHTML = names.slice(0, 6).map((n, i) => `<div class="tile ${i === 1 ? 'on' : ''}"><span class="speak"></span><div class="av">${n[0]}</div><span class="nm">${n}</span></div>`).join('');
const seed = [['خانم احمدی', 'سلام بچه‌ها، خوش آمدید. امروز جمع کسرها را مرور می‌کنیم.'], ['علی', 'سلام خانم، من آماده‌ام'], ['سارا', 'خانم، مخرج مشترک ۶ درست است؟'], ['خانم احمدی', 'بله سارا، آفرین. کسی می‌تواند توضیح بدهد چرا؟'], ['مهدیس', 'چون ۲ و ۳ هر دو در ۶ ضرب می‌شوند 👍']];
const msgs = document.getElementById('msgs');
const add = (who, text, me) => { const d = document.createElement('div'); d.className = 'm' + (me ? ' me' : ''); d.innerHTML = `<b></b><span></span>`; d.firstChild.textContent = who; d.lastChild.textContent = text; msgs.append(d); msgs.scrollTop = msgs.scrollHeight; };
seed.forEach(([w, t]) => add(w, t));
document.getElementById('form').onsubmit = (e) => { e.preventDefault(); const i = document.getElementById('msg'); if (!i.value.trim()) return; add('من', i.value.trim(), true); i.value = ''; };
document.querySelectorAll('footer [data-t]').forEach((b) => { b.onclick = () => b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true')); });
document.getElementById('hand').addEventListener('click', () => { const on = document.getElementById('hand').getAttribute('aria-pressed') === 'true'; document.getElementById('handCount').textContent = fa(on ? 2 : 1); document.getElementById('handWho').textContent = on ? 'سارا و من' : 'سارا'; });
let s = 0; setInterval(() => { s++; document.getElementById('timer').textContent = fa(String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0')); }, 1000);
setInterval(() => { const t = [...document.querySelectorAll('.grid .tile')]; t.forEach((x) => x.classList.remove('on')); t[Math.floor(Math.random() * t.length)].classList.add('on'); }, 2200);
document.getElementById('leave').onclick = () => { location.href = '/#/classes'; };
</script>
</body>
</html>
