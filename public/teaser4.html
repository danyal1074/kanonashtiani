<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قهرمان‌های کانون</title>
<meta name="description" content="۸ قدرت جدید برای قهرمان‌های کانون: پنل جدید دانش‌آموزان به‌زودی!">
<meta name="theme-color" content="#ffd60a">
<style>
  @font-face { font-family: Vazirmatn; src: url('fonts/Vazirmatn.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
  :root { --yel: #ffd60a; --ink: #111; --red: #ef233c; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; color: var(--ink); font-family: Vazirmatn, Tahoma, sans-serif; overflow: hidden;
    background: var(--yel) radial-gradient(circle, rgba(239,35,60,.35) 3px, transparent 4px) 0 0 / 18px 18px; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas#c { height: 100%; max-height: 100dvh; max-width: 100vw; aspect-ratio: 9 / 16; display: block; border: 6px solid var(--ink); box-shadow: 10px 10px 0 var(--ink); }
  .ui { position: fixed; inset: 0; display: grid; place-items: center; z-index: 5; transition: opacity .3s; }
  .ui.hide { opacity: 0; pointer-events: none; }
  .btn { font: inherit; font-weight: 900; font-size: 24px; color: #fff; background: var(--red); border: 5px solid var(--ink); padding: 12px 30px; cursor: pointer; text-decoration: none; display: inline-block;
    box-shadow: 7px 7px 0 var(--ink); transform: rotate(-3deg); animation: pop 1s infinite; }
  .btn:active { box-shadow: 2px 2px 0 var(--ink); transform: rotate(-3deg) translate(5px,5px); }
  .btn.sm { font-size: 16px; padding: 8px 18px; animation: none; background: #fff; color: var(--ink); }
  .card { text-align: center; } .card p { margin-top: 22px; font-weight: 800; background: #fff; border: 3px solid var(--ink); display: inline-block; padding: 4px 12px; }
  .row { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  @keyframes pop { 50% { transform: rotate(-3deg) scale(1.06); } }
  @media (prefers-reduced-motion: reduce) { .btn { animation: none; } }
  #end { place-items: end center; padding-bottom: max(30px, env(safe-area-inset-bottom)); }
</style>
</head>

<div id="stage"><canvas id="c" width="1080" height="1920"></canvas></div>
<div class="ui" id="start"><div class="card"><button class="btn" id="play">▶ پخش!</button><br><p>صدا رو زیاد کن 🔊</p></div></div>
<div class="ui hide" id="end"><div class="row"><button class="btn sm" id="replay">↻ دوباره</button><a class="btn sm" href="teaser4/teaser.mp4" download="kanon-heroes.mp4">⬇ دانلود ویدیو</a></div></div>

<script>

];

const FA = ['۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸'];

  c.lineWidth = ow; c.strokeStyle = INK; c.fillStyle = INK;
  for (let d = depth; d > 0; d -= 3) { c.strokeText(s, d, d); c.fillText(s, d, d); }

  c.fillStyle = INK; c.translate(10, 10); shape(); c.fill(); c.translate(-10, -10);

  c.lineWidth = 7; c.strokeStyle = INK; c.beginPath(); c.arc(0, -88, 22, .2, Math.PI - .2); c.stroke();                                                          // smile
  c.restore();
}

// ---------- icons (drawn around 0,0, about 560px box) ----------

function iconBrain(c, p, t) {

  blobs.forEach(([x, y, r]) => { c.fillStyle = '#ff8fab'; c.beginPath(); c.arc(x, y, r - 6, 0, 7); c.fill(); });
  c.lineWidth = 8; c.strokeStyle = '#c9184a'; c.lineCap = 'round';

function iconMedal(c, p, t) {

  O(c, () => c.arc(100, 40, 70, Math.PI, 0), ORANGE, 8);

  O(c, () => { c.moveTo(-300, 100); c.lineTo(300, 100); c.lineTo(340, 160); c.lineTo(-340, 160); c.closePath(); }, '#adb5bd');
  O(c, () => c.arc(-190, -140, 18, 0, 7), Math.floor(t * 3) % 2 ? RED : '#ffadad', 6);
  for (let i = 1; i <= 3; i++) { c.lineWidth = 14; c.strokeStyle = INK; c.beginPath(); c.arc(0, -250, i * 50, -2.4, -.75); c.stroke(); c.lineWidth = 7; c.strokeStyle = GREEN; c.stroke(); }
}
function iconPodium(c, p, t) {
  [[-180, 2, '۲', '#ced4da', 180], [0, 1, '۱', YEL, 260], [180, 3, '۳', ORANGE, 130]].forEach(([x, , n, col, h]) => {
    O(c, () => c.rect(x - 85, 260 - h, 170, h), col); ctext(c, n, x, 260 - h / 2 + 10, 90, WHITE, { depth: 5, ow: 12 }); });
  hero(c, 0, -120, .55 + Math.sin(t * 8) * .02, t, 0);
  O(c, () => { c.moveTo(-280, -120); c.lineTo(-190, -210); c.lineTo(-150, -170); c.lineTo(-60, -270); }, null, 18);
  c.lineWidth = 10; c.strokeStyle = GREEN; c.beginPath(); c.moveTo(-280, -120); c.lineTo(-190, -210); c.lineTo(-150, -170); c.lineTo(-60, -270); c.stroke();
  O(c, () => { c.moveTo(-60, -270); c.lineTo(-110, -265); c.lineTo(-70, -225); c.closePath(); }, GREEN, 8);
}

// ---------- scenes ----------
function sceneIntro(c, t) {
  bg(c, YEL, '#f2a900', t, CX, 900);
  // «توجه!» siren burst
  const s1 = back(lin(t, .05, .35)) * (t < 2.2 ? 1 : 1 - lin(t, 2.2, 2.4));
  burst(c, CX, 420, 260, RED, Math.sin(t * 20) * .04, s1, 16, 2);
  ctext(c, 'توجه، توجه!', CX, 420, 110, WHITE, { scale: s1, rot: -.05 });
  // hero flies in
  const hx = CX + 260 - eo(lin(t, 1.4, 2.3)) * 260, hy = 1950 - eo(lin(t, 1.4, 2.3)) * 980 + Math.sin(t * 3) * 15;
  if (t > 1.4) {
    for (let i = 0; i < 6; i++) { c.fillStyle = 'rgba(255,255,255,.7)'; c.fillRect(hx - 140 + i * 50, hy + 260 + i * 40, 18, 160); }
    hero(c, hx, hy, 1.5, t, -.15);
  }
  ctext(c, 'قهرمان‌های کانون…', CX, 1580, 104, WHITE, { scale: back(lin(t, 2.3, 2.7)), rot: -.04 });
  const s3 = back(lin(t, 3.6, 3.9));
  if (t >= 3.0) box(c, 130, 1690, 820, 150, RED, .03, 12, 16);
  if (t < 3.6) ctext(c, 'آماده باشید!', CX, 1765, 80, YEL, { alpha: lin(t, 3.0, 3.1), rot: .03 });
  else ctext(c, '۸ قدرت جدید داره میاد!', CX, 1765, 78, YEL, { scale: s3, rot: .03 });
}

function sceneFeature(c, t) {
  const k = Math.min(7, Math.floor((t - T.feat) / 3)), f = FEATS[k], p = t - T.feat - k * 3;
  bg(c, f.bg, f.dot, t, CX, 760);
  const dir = k % 2 ? -1 : 1;
  const xin = (1 - eo(lin(p, 0, .28))) * 1200 * dir - eo(lin(p, 2.72, 3)) * 1300 * dir;
  const shake = p > .25 && p < .45 ? (hash(t * 99) - .5) * 24 : 0;
  c.save(); c.translate(xin + shake, shake * .6);
  // caption box
  box(c, 120, 230, 380, 110, YEL, -.04, 10, 12);
  ctext(c, `قدرت ${FA[k]} از ۸`, 310, 287, 54, INK, { depth: 0, ow: 0, rot: -.04 });
  // panel
  const rot = dir * .02;
  c.save(); c.translate(CX, 770); c.rotate(rot);
  c.fillStyle = INK; c.fillRect(-430 + 22, -410 + 22, 860, 820);
  c.fillStyle = f.panel; c.fillRect(-430, -410, 860, 820);
  c.save(); c.beginPath(); c.rect(-430, -410, 860, 820); c.clip();
  c.fillStyle = 'rgba(0,0,0,.06)'; for (let y = -410; y < 410; y += 30) for (let x = -430 + (y % 60 ? 15 : 0); x < 430; x += 30) { c.beginPath(); c.arc(x, y, 7, 0, 7); c.fill(); }
  const is = back(lin(p, .15, .55)); c.translate(0, 20); c.scale(is * .95, is * .95); f.icon(c, p, t);
  c.restore();
  c.lineWidth = 14; c.strokeStyle = INK; c.strokeRect(-430, -410, 860, 820);
  c.restore();
  // onomatopoeia
  const ps = back(lin(p, .25, .5));
  burst(c, 830, 400, 150, YEL, .15, ps, 12, k + 1);
  ctext(c, f.pow, 830, 400, f.pow.length > 5 ? 62 : 80, RED, { scale: ps, rot: .15, depth: 5, ow: 12 });
  // feature name
  ctext(c, f.label, CX, 1270, 58, YEL, { alpha: lin(p, .35, .45), rot: -.02, depth: 4, ow: 12 });
  const ns = back(lin(p, .4, .75)), size = f.name.length > 12 ? 92 : 128;
  ctext(c, f.name, CX, 1400, size, WHITE, { scale: ns, rot: -.03, shine: true });
  bubble(c, CX + 20, 1640, f.tag, 52, back(lin(p, .9, 1.2)));
  c.restore();
}

function sceneMontage(c, t) {
  const p = t - T.montage, i = Math.min(7, Math.floor(p / BEAT)), u = (p % BEAT) / BEAT, [word, col] = MORE[i];
  bg(c, i % 2 ? '#111' : YEL, i % 2 ? '#333' : '#f2a900', t * 6, CX, 900);
  ctext(c, 'و تازه…', CX, 300, 90, i % 2 ? YEL : RED, { rot: -.05 });
  const s = back(clamp(u * 3)), r = (hash(i) - .5) * .3;
  burst(c, CX + (hash(i + 3) - .5) * 120, 960, 330, col, r, s, 16, i + 7);
  ctext(c, word, CX + (hash(i + 3) - .5) * 120, 960, word.length > 10 ? 76 : 104, WHITE, { scale: s, rot: r, ow: 16 });
  for (let j = 0; j <= i; j++) ctext(c, '★', 140 + j * 115, 1700, 70, j === i ? YEL : WHITE, { depth: 3, ow: 8 });
}

function logoBadge(c, x, y, r, s, t) {
  if (s <= 0) return;
  c.save(); c.translate(x, y); c.scale(s, s);
  burst(c, 0, 0, r * 1.25, YEL, t * .3, 1, 18, 9);
  c.fillStyle = INK; c.beginPath(); c.arc(10, 10, r, 0, 7); c.fill();
  c.fillStyle = WHITE; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill(); c.lineWidth = 12; c.strokeStyle = INK; c.stroke();
  if (logo.complete && logo.naturalWidth) { c.save(); c.beginPath(); c.arc(0, 0, r - 8, 0, 7); c.clip(); c.drawImage(logo, -r * .86, -r * .86, r * 1.72, r * 1.72); c.restore(); }
  c.restore();
}
function sceneReveal(c, t) {
  const p = t - T.reveal;
  bg(c, RED, '#c9184a', t, CX, 700);
  c.fillStyle = `rgba(255,255,255,${Math.max(0, 1 - p * 3)})`;
  const s = back(lin(p, .1, .45)) * (1 + Math.max(0, Math.sin((t - T.reveal) * Math.PI / BEAT)) * .02);
  burst(c, CX + 60, 640, 380, YEL, -.05, s, 18, 4);
  ctext(c, 'به‌زودی!', CX + 60, 640, 190, RED, { scale: s, rot: -.06, shine: true });
  const hx = -200 + eo(lin(p, 0, .8)) * 380, hy = 1300 - eo(lin(p, 0, .8)) * 1030 + Math.sin(t * 3) * 14;
  hero(c, hx, hy, .8, t, -.3);
  // banner
  const bs = eo(lin(p, .9, 1.2));
  if (bs > 0) { c.save(); c.translate(CX, 950); c.rotate(.03); c.scale(bs, 1);
    c.fillStyle = INK; c.beginPath(); c.moveTo(-500, -60); c.lineTo(-440, 0); c.lineTo(-500, 60); c.lineTo(-380, 60); c.lineTo(-380, -60); c.fill(); c.beginPath(); c.moveTo(500, -60); c.lineTo(440, 0); c.lineTo(500, 60); c.lineTo(380, 60); c.lineTo(380, -60); c.fill();
    box(c, -420, -80, 840, 160, BLUE, 0, 12, 14); c.restore();
    ctext(c, 'پنل جدید دانش‌آموزان', CX, 950, 80, WHITE, { alpha: lin(p, 1.1, 1.2), rot: .03 }); }
  logoBadge(c, CX, 1300, 170, back(lin(p, 1.8, 2.2)), t);
  ctext(c, 'کانون نخبه‌پروری شهید کاظم آشتیانی', CX, 1560, 44, WHITE, { alpha: lin(p, 2.4, 2.6), depth: 3, ow: 10 });
  bubble(c, CX, 1730, p < 6 ? 'قهرمان، آماده‌ای؟' : 'منتظرمون باش!', 64, back(lin(p, 3.0, 3.3)), true);
  if (t >= T.hit) { c.fillStyle = `rgba(255,255,255,${Math.max(0, .9 - (t - T.hit) * 3)})`; c.fillRect(0, 0, W, H); }
  if (t > DUR - .7) { c.fillStyle = `rgba(255,214,10,${lin(t, DUR - .7, DUR)})`; c.fillRect(0, 0, W, H); }
}

function render(t) {
  t = clamp(t, 0, DUR);
  const big = [T.feat, T.reveal, T.hit].some(h => t >= h && t < h + .25);
  ctx.save(); if (big) ctx.translate((hash(t * 97) - .5) * 24, (hash(t * 71) - .5) * 24);
  if (t < T.feat) sceneIntro(ctx, t);
  else if (t < T.montage) sceneFeature(ctx, t);
  else if (t < T.reveal) sceneMontage(ctx, t);
  else sceneReveal(ctx, t);
  ctx.restore();
  // white flash on each "POW"
  const f = [T.feat, ...FEATS.map((_, k) => T.feat + k * 3), T.reveal].find(h => t >= h && t < h + .12);
  if (f != null) { ctx.fillStyle = `rgba(255,255,255,${.6 * (1 - (t - f) / .12)})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- player ----------
const RENDER = new URLSearchParams(location.search).has('render');
const audio = document.getElementById('music');
window.teaserReady = Promise.all([document.fonts.load('900 40px Vazirmatn').then(() => document.fonts.ready),
  new Promise(r => { if (logo.complete) r(); else { logo.onload = r; logo.onerror = r; } })]);
window.renderAt = t => { render(t); return cv.toDataURL('image/jpeg', .92); };
window.TEASER_DURATION = DUR;
if (RENDER) { document.querySelectorAll('.ui').forEach(e => e.remove()); cv.style.cssText = 'height:auto;width:1080px;max-width:none;max-height:none;border:0;box-shadow:none'; return; }
window.teaserReady.then(() => render(37));
const start = document.getElementById('start'), end = document.getElementById('end'); let raf = 0;
function loop() { const t = audio.currentTime; render(t); if (audio.ended || t >= DUR - .05) { end.classList.remove('hide'); return; } raf = requestAnimationFrame(loop); }
function play() { start.classList.add('hide'); end.classList.add('hide'); audio.currentTime = 0; audio.play().catch(() => {}); cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); }
document.getElementById('play').onclick = play; document.getElementById('replay').onclick = play;
})();
</script>
