<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>به‌زودی…</title>
<meta name="description" content="یه سورپرایز داره میاد… فقط برای دانش‌آموزای کانون.">
<meta name="theme-color" content="#ffe8a3">
<style>
  @font-face { font-family: Vazirmatn; src: url('fonts/Vazirmatn.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
  :root { --bg: #fff3d6; --ink: #24305e; --pink: #ff5d8f; --yellow: #ffd23f; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: Vazirmatn, Tahoma, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  #bgblur { position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); filter: blur(40px) saturate(1.2); opacity: .85; }
  canvas#c { position: relative; height: 100%; max-height: 100dvh; max-width: 100vw; aspect-ratio: 9 / 16; display: block; box-shadow: 0 10px 60px rgba(36,48,94,.25); }
  .ui { position: fixed; inset: 0; display: grid; place-items: center; z-index: 5; transition: opacity .5s; }
  .ui.hide { opacity: 0; pointer-events: none; }
  .card { text-align: center; padding: 16px; }
  .card p { margin-top: 14px; font-size: 15px; font-weight: 600; background: rgba(255,255,255,.8); padding: 6px 14px; border-radius: 999px; display: inline-block; }
  .btn { font: inherit; font-weight: 900; font-size: 22px; color: #fff; background: var(--pink); border: 4px solid var(--ink); border-radius: 999px; padding: 14px 34px; cursor: pointer;
         box-shadow: 0 6px 0 var(--ink); animation: bounce 1.2s infinite; display: inline-flex; gap: 10px; align-items: center; text-decoration: none; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
  .btn.ghost { background: #fff; color: var(--ink); animation: none; font-size: 16px; padding: 10px 22px; border-width: 3px; box-shadow: 0 4px 0 var(--ink); }
  .btn.ghost.y { background: var(--yellow); }
  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  @keyframes bounce { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.04); } }
  @media (prefers-reduced-motion: reduce) { .btn { animation: none; } }
  #end { place-items: end center; padding-bottom: max(28px, env(safe-area-inset-bottom)); }
</style>
</head>
<body>
<div id="stage"><canvas id="bgblur" width="54" height="96"></canvas><canvas id="c" width="1080" height="1920"></canvas></div>

<div class="ui" id="start">
  <div class="card">
    <button class="btn" id="play">▶ پخش</button><br>
    <p>صدا رو زیاد کن 🔊</p>
  </div>
</div>
<div class="ui hide" id="end">
  <div class="card row">
    <button class="btn ghost" id="replay">↻ دوباره</button>
    <a class="btn ghost y" href="teaser/teaser.mp4" download="kanon-coming-soon.mp4">⬇ دانلود ویدیو</a>
  </div>
</div>

<audio id="music" src="teaser/teaser-music.mp3" preload="auto"></audio>

<script>
(() => {
'use strict';
// ====== timeline (هماهنگ با scripts/teaser/make-music.py) ======
const BEAT = 0.625, BAR = 2.5, DUR = 43;
const W = 1080, H = 1920, CX = W / 2;
const T = { hints: 7.5, build: 25, drop: 30, reveal: 32.5, final: 40 };

// palette
const INK = '#24305e', WHITE = '#ffffff';
const C = { pink: '#ff5d8f', yellow: '#ffd23f', mint: '#2ec4b6', sky: '#4cc9f0', purple: '#9b5de5', orange: '#ff8c42', green: '#7bd389', red: '#ff6b6b' };
const CONF = [C.pink, C.yellow, C.mint, C.sky, C.purple, C.orange, C.green];

const HINTS = [
  { n: '۰۱', a: 'یه ساعت…', b: 'که فقط برای تو می‌شمره', col: C.sky,    bg: ['#bdeaff', '#fff4c7'], draw: drawClock },
  { n: '۰۲', a: 'یه مسیر…', b: 'که خودش راه رو بلده',      col: C.mint,   bg: ['#c9f7e9', '#fff1d0'], draw: drawPath },
  { n: '۰۳', a: 'کلاسی',    b: 'که دیوار نداره',            col: C.pink,   bg: ['#ffd6e5', '#fff3c4'], draw: drawFrame },
  { n: '۰۴', a: 'قفسه‌ای',  b: 'که هیچ‌وقت بسته نمی‌شه',    col: C.orange, bg: ['#ffe0c7', '#e9f7ff'], draw: drawShelf },
  { n: '۰۵', a: 'بازی؟ داستان؟', b: 'شاید هر دو…',          col: C.purple, bg: ['#e7d9ff', '#fff0d6'], draw: drawCube },
  { n: '۰۶', a: 'سکه‌هایی', b: 'که ارزش جمع کردن دارن',     col: C.yellow, bg: ['#fff1a8', '#ffe1ec'], draw: drawCoin },
  { n: '۰۷', a: 'نقشه‌ای',  b: 'که نشون می‌ده چقدر بزرگ شدی', col: C.green, bg: ['#d4f5d0', '#e3f1ff'], draw: drawStars },
];

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const bg = document.getElementById('bgblur'), bgx = bg.getContext('2d');
const logo = new Image(); logo.src = 'img/logo-ashtiani.png';

// ====== helpers ======
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const back = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };       // overshoot
const elastic = x => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * 2.094) + 1;
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const win = (t, a, b, fi = .2, fo = .2) => Math.min(lin(t, a, a + fi), 1 - lin(t, b - fo, b));

// beat pulse (synced to the music)
const KNOCKS = [];
for (let i = 0; i < 6; i++) KNOCKS.push(.3 + i * 1.25, .5 + i * 1.25);
KNOCKS.push(30.9, 31.15, 31.7, 31.95);
function knockAmt(t) { let k = 0; for (const s of KNOCKS) if (t >= s && t < s + .4) k = Math.max(k, Math.exp(-(t - s) * 9)); return k; }
function pulse(t) {
  if (t < T.hints) return knockAmt(t);
  if (t < T.drop) return Math.exp(-((t - T.hints) % (BEAT * 2)) * 6);
  if (t < T.reveal) return knockAmt(t);
  return Math.exp(-((t - T.reveal) % BEAT) * 6);
}

// sticker text: white fill, thick navy outline, colored drop "shadow"
function txt(c, s, x, y, size, o = {}) {
  const a = o.alpha ?? 1; if (a <= 0 || !s) return;
  c.save(); c.globalAlpha = clamp(a);
  c.translate(x, y); if (o.rot) c.rotate(o.rot); if (o.scale != null) c.scale(o.scale, o.scale);
  c.font = `${o.weight || 900} ${size}px Vazirmatn`;
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.direction = 'rtl'; c.lineJoin = 'round';
  const sw = o.sw ?? size * .14;
  if (o.plain) { c.fillStyle = o.fill || INK; c.fillText(s, 0, 0); c.restore(); return; }
  const off = o.drop ?? size * .07;
  c.lineWidth = sw; c.strokeStyle = o.shadow || INK; c.fillStyle = o.shadow || INK;
  c.strokeText(s, 0, off); c.fillText(s, 0, off);
  c.strokeStyle = o.stroke || INK; c.strokeText(s, 0, 0);
  c.fillStyle = o.fill || WHITE; c.fillText(s, 0, 0);
  c.restore();
}
const typed = (s, p) => { const ch = [...s]; return ch.slice(0, Math.ceil(ch.length * clamp(p))).join(''); };
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function star(c, x, y, r, n = 5, inner = .5) {
  c.beginPath(); for (let i = 0; i < n * 2; i++) { const a = i * Math.PI / n - Math.PI / 2, rr2 = i % 2 ? r * inner : r; c.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); } c.closePath();
}
function shape(c, k, s) { // confetti piece
  if (k === 0) { c.beginPath(); c.arc(0, 0, s * .55, 0, 7); c.fill(); }
  else if (k === 1) { c.fillRect(-s * .7, -s * .3, s * 1.4, s * .6); }
  else if (k === 2) { c.beginPath(); c.moveTo(0, -s * .6); c.lineTo(s * .55, s * .45); c.lineTo(-s * .55, s * .45); c.closePath(); c.fill(); }
  else { star(c, 0, 0, s * .7); c.fill(); }
}

// ====== background ======
function sky(c, top, bottom) {
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, top); g.addColorStop(1, bottom);
  c.fillStyle = g; c.fillRect(0, 0, W, H);
}
function rays(c, x, y, t, alpha, cols) {
  c.save(); c.translate(x, y); c.rotate(t * .25);
  const n = 16;
  for (let i = 0; i < n; i++) {
    c.fillStyle = cols ? cols[i % cols.length] : '#ffffff'; c.globalAlpha = alpha;
    c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, 1600, i * 2 * Math.PI / n, (i + .5) * 2 * Math.PI / n); c.closePath(); c.fill();
  }
  c.restore();
}
function cloud(c, x, y, s, a = .9) {
  c.save(); c.globalAlpha = a; c.fillStyle = '#fff';
  [[0, 0, 1], [.8, .15, .75], [-.8, .2, .7], [.35, -.45, .7], [-.35, -.35, .6]].forEach(([dx, dy, r]) => { c.beginPath(); c.arc(x + dx * s, y + dy * s, r * s, 0, 7); c.fill(); });
  c.fillRect(x - s * 1.3, y, s * 2.6, s * .7); c.restore();
}
function ambient(c, t, amt = 1) {
  // drifting clouds
  for (let i = 0; i < 4; i++) { const sp = 18 + i * 9, x = ((hash(i + 40) * (W + 600) + t * sp) % (W + 600)) - 300; cloud(c, x, 150 + i * 430 + (i % 2) * 120, 70 + hash(i) * 50, .75); }
  // falling confetti
  for (let i = 0; i < 46 * amt; i++) {
    const sp = 60 + hash(i) * 120, y = ((hash(i + 3) * (H + 200) + t * sp) % (H + 200)) - 100;
    const x = hash(i + 7) * W + Math.sin(t * 1.3 + i) * 40, s = 14 + hash(i + 11) * 20;
    c.save(); c.translate(x, y); c.rotate(t * (1 + hash(i + 2) * 3) + i); c.scale(1, Math.cos(t * 3 + i));
    c.globalAlpha = .75; c.fillStyle = CONF[i % CONF.length]; shape(c, i % 4, s); c.restore();
  }
}

// ====== the mystery gift box ======
function gift(c, x, y, s, o = {}) {
  const shake = o.shake || 0, lid = o.lid || 0, t = o.t || 0;
  c.save(); c.translate(x, y);
  // shadow
  c.fillStyle = 'rgba(36,48,94,.15)'; c.beginPath(); c.ellipse(0, s * .52, s * .62 * (1 - shake * .1), s * .09, 0, 0, 7); c.fill();
  c.rotate(Math.sin(t * 40) * .08 * shake);
  c.translate(0, -shake * 40); c.scale(1 + shake * .06, 1 - shake * .06);
  c.lineWidth = s * .035; c.strokeStyle = INK; c.lineJoin = 'round';
  // body
  c.fillStyle = C.pink; rr(c, -s * .5, -s * .25, s, s * .75, s * .06); c.fill(); c.stroke();
  c.fillStyle = C.yellow; c.fillRect(-s * .08, -s * .25, s * .16, s * .75); c.strokeRect(-s * .08, -s * .25, s * .16, s * .75);
  txt(c, '؟', -s * .29, s * .13, s * .34, { sw: s * .03, drop: s * .015 });
  txt(c, '؟', s * .29, s * .13, s * .34, { sw: s * .03, drop: s * .015 });
  // glow from inside when opening
  if (lid > 0) { const g = c.createRadialGradient(0, -s * .3, 0, 0, -s * .3, s * 1.4); g.addColorStop(0, `rgba(255,248,200,${.9 * lid})`); g.addColorStop(1, 'rgba(255,248,200,0)'); c.fillStyle = g; c.fillRect(-s * 1.5, -s * 1.8, s * 3, s * 1.6); }
  // lid + bow
  c.save(); c.translate(0, -s * .25 - lid * s * 2.2); c.rotate(-lid * .9); c.globalAlpha = 1 - lin(lid, .6, 1);
  c.fillStyle = '#ff7aa3'; rr(c, -s * .58, -s * .2, s * 1.16, s * .22, s * .05); c.fill(); c.stroke();
  c.fillStyle = C.yellow; c.fillRect(-s * .08, -s * .2, s * .16, s * .22); c.strokeRect(-s * .08, -s * .2, s * .16, s * .22);
  [-1, 1].forEach(d => { c.beginPath(); c.ellipse(d * s * .17, -s * .3, s * .19, s * .11, d * -.5, 0, 7); c.fill(); c.stroke(); });
  c.beginPath(); c.arc(0, -s * .27, s * .07, 0, 7); c.fill(); c.stroke();
  c.restore();
  c.restore();
}

// ====== hint visuals (playful but vague) — p: local time 0..2.5 ======
const VY = 800;
function bubble(c, p, col, t) {
  const s = back(lin(p, 0, .45));
  c.save(); c.translate(CX, VY); c.scale(s, s);
  c.fillStyle = 'rgba(36,48,94,.12)'; c.beginPath(); c.arc(10, 24, 360, 0, 7); c.fill();
  c.fillStyle = '#fff'; c.beginPath(); c.arc(0, 0, 360, 0, 7); c.fill();
  c.lineWidth = 16; c.strokeStyle = col; c.setLineDash([46, 26]); c.lineDashOffset = -t * 60; c.beginPath(); c.arc(0, 0, 330, 0, 7); c.stroke(); c.setLineDash([]);
  c.restore();
  return s;
}
function drawClock(c, p, a) {
  const r = 200; c.save(); c.globalAlpha = a; c.translate(CX, VY); c.lineCap = 'round'; c.lineJoin = 'round';
  // little bells on top
  [-1, 1].forEach(d => { c.save(); c.rotate(d * .6 + Math.sin(p * 30) * .06 * (p < 1)); c.fillStyle = C.red; c.strokeStyle = INK; c.lineWidth = 8;
    c.beginPath(); c.arc(0, -r - 40, 62, Math.PI, 0); c.closePath(); c.fill(); c.stroke(); c.restore(); });
  c.fillStyle = C.sky; c.strokeStyle = INK; c.lineWidth = 10; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill(); c.stroke();
  c.fillStyle = '#fff'; c.beginPath(); c.arc(0, 0, r - 36, 0, 7); c.fill();
  const sw = eo(lin(p, .1, 2.2)) * Math.PI * 2; c.fillStyle = 'rgba(76,201,240,.35)';
  c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, r - 46, -Math.PI / 2, -Math.PI / 2 + sw); c.closePath(); c.fill();
  for (let i = 0; i < 12; i++) { const an = i / 12 * Math.PI * 2; c.fillStyle = INK; c.beginPath(); c.arc(Math.sin(an) * (r - 62), -Math.cos(an) * (r - 62), i % 3 ? 6 : 11, 0, 7); c.fill(); }
  const hand = -Math.PI / 2 + sw; c.strokeStyle = INK; c.lineWidth = 14;
  c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(hand) * (r - 80), Math.sin(hand) * (r - 80)); c.stroke();
  c.lineWidth = 16; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -(r - 110)); c.stroke();
  c.fillStyle = C.yellow; c.beginPath(); c.arc(0, 0, 18, 0, 7); c.fill(); c.lineWidth = 6; c.stroke();
  c.restore();
}
function drawPath(c, p, a) {
  c.save(); c.globalAlpha = a; c.translate(CX, VY);
  const pts = []; for (let i = 0; i <= 80; i++) { const u = i / 80; pts.push([Math.sin(u * 8 + 1) * 200 * (1 - u * .3), 250 - u * 480]); }
  const k = Math.floor(eo(lin(p, 0, 2)) * 80);
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.lineWidth = 46; c.strokeStyle = '#e8eef7'; c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.stroke();
  c.lineWidth = 46; c.strokeStyle = C.mint; c.beginPath(); for (let i = 0; i <= k; i++) i ? c.lineTo(...pts[i]) : c.moveTo(...pts[i]); c.stroke();
  c.lineWidth = 6; c.strokeStyle = '#fff'; c.setLineDash([18, 18]); c.beginPath(); for (let i = 0; i <= k; i++) i ? c.lineTo(...pts[i]) : c.moveTo(...pts[i]); c.stroke(); c.setLineDash([]);
  [0, 20, 40, 60].forEach((i, j) => { if (i <= k) { c.fillStyle = CONF[j + 1]; c.strokeStyle = INK; c.lineWidth = 7; c.beginPath(); c.arc(...pts[i], 26, 0, 7); c.fill(); c.stroke(); } });
  if (k >= 78) { const [x, y] = pts[80], s = back(lin(p, 2.0, 2.3)); c.save(); c.translate(x, y); c.scale(s, s); c.strokeStyle = INK; c.lineWidth = 8;
    c.beginPath(); c.moveTo(0, 20); c.lineTo(0, -90); c.stroke(); c.fillStyle = C.red; c.beginPath(); c.moveTo(0, -90); c.lineTo(-70, -65); c.lineTo(0, -40); c.closePath(); c.fill(); c.stroke(); c.restore(); }
  c.restore();
}
function drawFrame(c, p, a) {
  c.save(); c.globalAlpha = a; c.translate(CX, VY);
  const w = 440, h = 300, dis = eo(lin(p, .7, 2.2));
  // bricks (the wall) fly away
  const bw = 88, bh = 50;
  for (let i = 0; i < 5; i++) for (let j = 0; j < 6; j++) {
    const id = i * 6 + j, an = hash(id + 50) * 7, d = dis * (200 + hash(id) * 500);
    const x = -w / 2 + i * bw + Math.cos(an) * d, y = -h / 2 + j * bh + Math.sin(an) * d;
    c.save(); c.translate(x + bw / 2, y + bh / 2); c.rotate(dis * (hash(id + 3) - .5) * 4); c.globalAlpha = a * (1 - dis * .9);
    c.fillStyle = id % 2 ? '#ff9b85' : '#ff7f6e'; c.strokeStyle = INK; c.lineWidth = 4; rr(c, -bw / 2 + 3, -bh / 2 + 3, bw - 6, bh - 6, 8); c.fill(); c.stroke(); c.restore();
  }
  // behind the wall: a friendly screen
  c.globalAlpha = a * lin(p, .6, 1.4);
  c.fillStyle = C.pink; c.strokeStyle = INK; c.lineWidth = 10; rr(c, -w / 2, -h / 2, w, h, 30); c.fill(); c.stroke();
  c.fillStyle = '#fff'; c.beginPath(); c.moveTo(-40, -60); c.lineTo(-40, 60); c.lineTo(65, 0); c.closePath(); c.fill(); c.lineWidth = 7; c.stroke();
  c.fillStyle = C.yellow; c.beginPath(); c.arc(w / 2 - 36, -h / 2 + 36, 14 + 4 * Math.sin(p * 10), 0, 7); c.fill();
  c.restore();
}
function drawShelf(c, p, a) {
  c.save(); c.globalAlpha = a; c.translate(CX, VY + 170);
  const n = 9, bw = 52, gap = 8, tot = n * (bw + gap);
  for (let i = 0; i < n; i++) {
    const h = 200 + hash(i * 3.1) * 140, x = -tot / 2 + i * (bw + gap), on = back(lin(p, .1 + i * .1, .45 + i * .1));
    c.save(); c.translate(x + bw / 2, 0); c.rotate(i === 6 ? -.2 : 0); c.translate(0, (1 - on) * -700); c.globalAlpha = a * clamp(on * 2);
    c.fillStyle = CONF[i % CONF.length]; c.strokeStyle = INK; c.lineWidth = 7; rr(c, -bw / 2, -h, bw, h, 10); c.fill(); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.7)'; c.fillRect(-bw / 2 + 10, -h + 30, bw - 20, 10); c.fillRect(-bw / 2 + 10, -h + 50, bw - 20, 6);
    c.restore();
  }
  c.fillStyle = '#c98a5b'; c.strokeStyle = INK; c.lineWidth = 7; rr(c, -tot / 2 - 30, 0, tot + 60, 30, 8); c.fill(); c.stroke();
  c.restore();
}
function drawCube(c, p, a) {
  c.save(); c.globalAlpha = a; c.translate(CX, VY);
  const s = 150, ry = p * 1.4 + .6, rx = .55 + Math.sin(p * 2) * .2, bob = Math.sin(p * 5) * 20;
  c.translate(0, bob);
  const V = [-1, 1].flatMap(x => [-1, 1].flatMap(y => [-1, 1].map(z => [x, y, z])));
  const P = V.map(([x, y, z]) => { let X = x * Math.cos(ry) - z * Math.sin(ry), Z = x * Math.sin(ry) + z * Math.cos(ry); let Y = y * Math.cos(rx) - Z * Math.sin(rx); Z = y * Math.sin(rx) + Z * Math.cos(rx); return [X * s, Y * s, Z]; });
  const F = [[0, 1, 3, 2], [4, 5, 7, 6], [0, 1, 5, 4], [2, 3, 7, 6], [0, 2, 6, 4], [1, 3, 7, 5]];
  const cols = [C.purple, C.sky, C.yellow, C.mint, C.pink, C.orange];
  F.map((f, i) => ({ f, i, z: f.reduce((s2, k) => s2 + P[k][2], 0) })).sort((u, v) => v.z - u.z).forEach(({ f, i }) => {
    c.fillStyle = cols[i]; c.strokeStyle = INK; c.lineWidth = 9; c.lineJoin = 'round';
    c.beginPath(); f.forEach((k, j) => j ? c.lineTo(P[k][0], P[k][1]) : c.moveTo(P[k][0], P[k][1])); c.closePath(); c.fill(); c.stroke();
  });
  c.restore();
  for (let i = 0; i < 3; i++) { const an = p * 1.6 + i * 2.1; txt(c, '؟', CX + Math.cos(an) * 290, VY + Math.sin(an) * 120 - 20, 90, { alpha: a, fill: CONF[i], sw: 10, rot: Math.sin(p * 4 + i) * .3 }); }
}
function drawCoin(c, p, a) {
  c.save(); c.globalAlpha = a; c.translate(CX, VY);
  const sx = Math.cos(p * 5.5), r = 170, up = -Math.sin(lin(p, 0, 1.4) * Math.PI) * 150;
  c.translate(0, up); c.scale(Math.max(.08, Math.abs(sx)), 1);
  c.fillStyle = '#f5a623'; c.strokeStyle = INK; c.lineWidth = 10; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill(); c.stroke();
  c.fillStyle = C.yellow; c.beginPath(); c.arc(0, 0, r - 28, 0, 7); c.fill(); c.lineWidth = 6; c.stroke();
  c.fillStyle = '#fff'; star(c, 0, 0, 80); c.fill(); c.lineWidth = 7; c.stroke();
  c.fillStyle = 'rgba(255,255,255,.6)'; c.beginPath(); c.ellipse(-70, -80, 26, 14, -.7, 0, 7); c.fill();
  c.restore();
  for (let i = 0; i < 10; i++) { const an = hash(i) * 7, d = 230 + hash(i + 9) * 90, tw = Math.max(0, Math.sin(p * 6 + i * 1.7));
    c.save(); c.globalAlpha = a * tw; c.fillStyle = CONF[i % CONF.length]; star(c, CX + Math.cos(an) * d, VY + Math.sin(an) * d, 22 * tw + 6, 4, .4); c.fill(); c.restore(); }
}
function drawStars(c, p, a) {
  c.save(); c.globalAlpha = a; c.translate(CX, VY);
  // growing steps
  const n = 6;
  for (let i = 0; i < n; i++) {
    const on = back(lin(p, .1 + i * .2, .45 + i * .2)), h = 60 + i * 60, x = 240 - i * 90 - 40;
    c.save(); c.translate(x, 250); c.scale(1, on); c.fillStyle = CONF[(i + 2) % CONF.length]; c.strokeStyle = INK; c.lineWidth = 7; rr(c, 0, -h, 80, h, 12); c.fill(); c.stroke(); c.restore();
  }
  // a little flag-star on top
  const s = back(lin(p, 1.4, 1.8));
  if (s > 0) { c.save(); c.translate(-210, 250 - (60 + 5 * 60) - 70); c.scale(s, s); c.rotate(Math.sin(p * 5) * .2);
    c.fillStyle = C.yellow; c.strokeStyle = INK; c.lineWidth = 8; star(c, 0, 0, 60); c.fill(); c.stroke(); c.restore(); }
  c.restore();
}

// ====== scenes ======
function hud(c, t, idx, p, col) {
  const a = win(p, 0, BAR, .15, .15), s = back(lin(p, .05, .35));
  c.save(); c.globalAlpha = a; c.translate(CX, 290); c.scale(s, s);
  c.fillStyle = col; c.strokeStyle = INK; c.lineWidth = 7; rr(c, -150, -50, 300, 100, 50); c.fill(); c.stroke(); c.restore();
  txt(c, `سرنخ ${HINTS[idx].n}`, CX, 292, 54, { alpha: a, sw: 8, drop: 3, scale: s });
  for (let i = 0; i < 7; i++) {
    const x = CX + (3 - i) * 52; c.globalAlpha = 1; c.fillStyle = i <= idx ? HINTS[i].col : 'rgba(255,255,255,.8)'; c.strokeStyle = INK; c.lineWidth = 4;
    c.beginPath(); c.arc(x, 395, i === idx ? 15 : 10, 0, 7); c.fill(); c.stroke();
  }
}

function sceneIntro(c, t) {
  sky(c, '#bfe9ff', '#fff2c9');
  rays(c, CX, 980, t, .22);
  ambient(c, t, .6);
  const pop = back(lin(t, .1, .7));
  gift(c, CX, 1050, 380 * pop, { shake: knockAmt(t), t });
  txt(c, typed('یه چیزی…', lin(t, 1.0, 1.9)), CX, 420, 110, { alpha: win(t, 1.0, 4.0, .1, .3), shadow: C.sky });
  txt(c, typed('داره میاد!', lin(t, 1.9, 2.8)), CX, 560, 84, { alpha: win(t, 1.9, 4.0, .1, .3), fill: C.yellow });
  txt(c, 'تو کانون', CX, 420, 110, { alpha: win(t, 4.2, 7.4, .3, .25), scale: back(lin(t, 4.2, 4.6)), shadow: C.pink });
  txt(c, typed('یه سورپرایز بزرگ…', lin(t, 4.8, 5.8)), CX, 560, 80, { alpha: win(t, 4.8, 7.4, .1, .25), fill: C.yellow });
  txt(c, 'که تا حالا ندیدی!', CX, 1560, 66, { alpha: win(t, 6.0, 7.4, .3, .2), scale: back(lin(t, 6.0, 6.4)), fill: '#fff', shadow: C.mint });
}

function sceneHint(c, t) {
  const idx = Math.min(6, Math.floor((t - T.hints) / BAR)), p = (t - T.hints) - idx * BAR, h = HINTS[idx];
  sky(c, h.bg[0], h.bg[1]);
  rays(c, CX, VY, t, .25);
  ambient(c, t, .7);
  const a = win(p, 0, BAR, .12, .18);
  c.save(); c.globalAlpha = a; bubble(c, p, h.col, t); c.restore();
  const s = back(lin(p, .05, .5)); c.save(); c.translate(CX, VY); c.scale(s, s); c.translate(-CX, -VY); h.draw(c, p, a); c.restore();
  hud(c, t, idx, p, h.col);
  txt(c, h.a, CX, 1310, 104, { alpha: a * lin(p, .15, .3), scale: back(lin(p, .15, .5)), shadow: h.col });
  txt(c, h.b, CX, 1440, 62, { alpha: a * lin(p, .5, .7), scale: back(lin(p, .5, .8)), fill: h.col, sw: 10 });
  // mini gift box peeking in the corner: still a secret!
  gift(c, 900, 1720, 140, { shake: pulse(t) * .6, t });
}

function sceneBuild(c, t) {
  const p = t - T.build;
  const step = p < 2 ? BEAT : p < 3.75 ? BEAT / 2 : BEAT / 4;
  const k = Math.floor(p / step), idx = Math.floor(hash(k + 3) * 7), h = HINTS[idx];
  sky(c, h.bg[0], h.bg[1]);
  rays(c, CX, VY, t * 3, .3, [h.col, '#ffffff']);
  ambient(c, t, 1);
  const s = back(lin(p % step, 0, Math.min(.2, step * .8)));
  c.save(); c.translate(CX, VY); c.scale(s * (.8 + p * .05), s * (.8 + p * .05)); c.translate(-CX, -VY); h.draw(c, 1.2 + (p % step), 1); c.restore();
  const lines = [['۷ سرنخ', 0, 1.25, C.sky], ['۱ سورپرایز', 1.25, 2.5, C.pink], ['حدس می‌زنی', 2.5, 3.75, C.purple], ['چیه؟', 3.75, 5, C.orange]];
  lines.forEach(([s2, a0, a1, col]) => txt(c, s2, CX, 1350, 140, { alpha: win(p, a0, a1, .02, .05), scale: back(lin(p, a0, a0 + .3)) * (1 + pulse(t) * .05), shadow: col, fill: s2 === 'چیه؟' ? C.yellow : '#fff' }));
  if (p > 2.5) for (let i = 0; i < Math.floor((p - 2.5) * 9); i++) {
    const x = 80 + hash(i * 7) * (W - 160), y = 200 + hash(i * 13) * (H - 400), sz = 70 + hash(i) * 80;
    txt(c, '؟', x, y, sz, { scale: back(clamp((p - 2.5 - i / 9) * 4)), fill: CONF[i % CONF.length], sw: 10, rot: (hash(i + 1) - .5) * .8 });
  }
  gift(c, 900, 1720, 140, { shake: pulse(t), t });
  c.fillStyle = `rgba(255,255,255,${Math.pow(lin(p, 4.6, 5), 3)})`; c.fillRect(0, 0, W, H);
}

function sceneDrop(c, t) {
  const p = t - T.drop;
  sky(c, '#e6dcff', '#fff0d6');
  rays(c, CX, 1050, t, .25);
  ambient(c, t, .3);
  gift(c, CX, 1100, 420 * back(lin(p, 0, .5)), { shake: knockAmt(t) + (p > 2 ? Math.sin(p * 50) * .3 : 0), t });
  txt(c, 'هنوز نمی‌تونیم بگیم چیه…', CX, 470, 70, { alpha: win(p, .3, 2.4, .2, .2), shadow: C.purple });
  txt(c, 'ولی…', CX, 600, 96, { alpha: win(p, 1.5, 2.45, .15, .1), scale: back(lin(p, 1.5, 1.8)), fill: C.yellow });
  c.fillStyle = `rgba(255,255,255,${Math.max(0, 1 - p * 3)})`; c.fillRect(0, 0, W, H);
}

// deterministic confetti burst
function burst(c, t0, t, x0, y0, n = 170, seed = 1) {
  const u = t - t0; if (u < 0) return;
  for (let i = 0; i < n; i++) {
    const an = -Math.PI / 2 + (hash(i * 3 + seed) - .5) * 2.6, sp = 900 + hash(i * 5 + seed) * 1700, k = 1.6;
    const d = (1 - Math.exp(-k * u)) / k;
    const x = x0 + Math.cos(an) * sp * d + Math.sin(u * 3 + i) * 30, y = y0 + Math.sin(an) * sp * d + 420 * u * u;
    if (y > H + 50) continue;
    c.save(); c.translate(x, y); c.rotate(u * (4 + hash(i) * 6) + i); c.scale(1, Math.cos(u * 6 + i));
    c.fillStyle = CONF[i % CONF.length]; shape(c, i % 4, 18 + hash(i + 9) * 18); c.restore();
  }
}

function logoBadge(c, x, y, r, a) {
  if (a <= 0) return;
  c.save(); c.globalAlpha = clamp(a); c.translate(x, y); c.scale(back(clamp(a)), back(clamp(a)));
  c.fillStyle = INK; c.beginPath(); c.arc(0, 8, r + 10, 0, 7); c.fill();
  c.fillStyle = '#fff'; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill(); c.lineWidth = 10; c.strokeStyle = INK; c.stroke();
  if (logo.complete && logo.naturalWidth) { c.beginPath(); c.arc(0, 0, r - 8, 0, 7); c.clip(); c.drawImage(logo, -r * .86, -r * .86, r * 1.72, r * 1.72); }
  c.restore();
}

function sceneReveal(c, t) {
  const p = t - T.reveal;
  sky(c, '#ffe08a', '#ffc2d9');
  rays(c, CX, 1050, t, .5, [C.yellow, '#fff', C.pink, '#fff', C.sky, '#fff', C.mint, '#fff']);
  ambient(c, t, 1);
  const lid = eo(lin(p, 0, .6));
  gift(c, CX, 1180 + eo(lin(p, .8, 1.6)) * 520, 380, { lid, t, shake: p < .2 ? 1 : 0 });
  burst(c, T.reveal, t, CX, 1060, 170, 1);
  const s = elastic(lin(p, .05, 1.0));
  txt(c, 'به‌زودی!', CX, 700, 210, { scale: s * (1 + pulse(t) * .03), shadow: C.pink, fill: '#fff', rot: Math.sin(t * 2) * .03 });
  txt(c, 'یه سورپرایز رنگی', CX, 920, 76, { alpha: lin(p, 1.0, 1.2), scale: back(lin(p, 1.0, 1.4)), fill: C.yellow, sw: 11 });
  txt(c, 'فقط برای دانش‌آموزای کانون', CX, 1030, 60, { alpha: lin(p, 1.5, 1.7), scale: back(lin(p, 1.5, 1.9)), sw: 9, shadow: C.mint });
  logoBadge(c, CX, 1340, 150, lin(p, 2.6, 3.1));
  txt(c, 'کانون نخبه‌پروری شهید کاظمی آشتیانی', CX, 1575, 46, { alpha: lin(p, 3.2, 3.6), sw: 8, drop: 3 });
  txt(c, 'آماده‌ای؟', CX, 1720, 92, { alpha: lin(p, 5.0, 5.2), scale: back(lin(p, 5.0, 5.4)) * (1 + pulse(t) * .06), fill: C.yellow, shadow: C.pink, rot: -.04 });
}

function sceneFinal(c, t) {
  const p = t - T.final;
  sky(c, '#bfe9ff', '#ffd6e8');
  rays(c, CX, 640, t, .45, [C.yellow, '#fff', C.mint, '#fff', C.pink, '#fff']);
  ambient(c, t, 1);
  burst(c, T.final, t, 200, 1900, 90, 7); burst(c, T.final, t, 880, 1900, 90, 13);
  logoBadge(c, CX, 560, 190, lin(p, 0, .35));
  txt(c, 'به‌زودی!', CX, 960, 220, { scale: elastic(lin(p, 0, .9)), shadow: C.pink, rot: Math.sin(t * 2) * .03 });
  txt(c, 'یه چیز باحال تو راهه…', CX, 1160, 72, { alpha: lin(p, .3, .5), scale: back(lin(p, .3, .7)), fill: C.yellow, sw: 11 });
  txt(c, 'کانون نخبه‌پروری شهید کاظمی آشتیانی', CX, 1620, 46, { alpha: lin(p, .6, .9), sw: 8, drop: 3 });
  txt(c, '#به‌زودی', CX, 1730, 60, { alpha: lin(p, .9, 1.1), scale: back(lin(p, .9, 1.3)), fill: C.mint, sw: 9 });
  c.fillStyle = `rgba(255,255,255,${Math.max(0, 1 - p * 3)})`; c.fillRect(0, 0, W, H);
  c.fillStyle = `rgba(255,243,214,${Math.pow(lin(p, 2.3, 3), 2)})`; c.fillRect(0, 0, W, H);
}

function render(t) {
  t = clamp(t, 0, DUR);
  const hit = [T.hints, T.drop, T.reveal, T.final].some(h => t >= h && t < h + .3);
  const shake = hit ? 12 : 0, sx = (hash(t * 97) - .5) * shake, sy = (hash(t * 71) - .5) * shake;
  ctx.save(); ctx.translate(sx, sy);
  if (t < T.hints) sceneIntro(ctx, t);
  else if (t < T.build) sceneHint(ctx, t);
  else if (t < T.drop) sceneBuild(ctx, t);
  else if (t < T.reveal) sceneDrop(ctx, t);
  else if (t < T.final) sceneReveal(ctx, t);
  else sceneFinal(ctx, t);
  ctx.restore();
  // soft white frame
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 28; ctx.strokeRect(0, 0, W, H); ctx.restore();
  if (!RENDER) bgx.drawImage(cv, 0, 0, bg.width, bg.height);
}

// ====== player ======
const RENDER = new URLSearchParams(location.search).has('render');
const audio = document.getElementById('music');
const fontReady = document.fonts.load('900 40px Vazirmatn').then(() => document.fonts.ready);
const logoReady = new Promise(r => { if (logo.complete) r(); else { logo.onload = r; logo.onerror = r; } });
window.teaserReady = Promise.all([fontReady, logoReady]);
window.renderAt = t => { render(t); return cv.toDataURL('image/jpeg', .92); };
window.TEASER_DURATION = DUR;

if (RENDER) { document.querySelectorAll('.ui').forEach(e => e.remove()); bg.remove(); cv.style.cssText = 'height:auto;width:1080px;max-width:none;max-height:none;box-shadow:none'; return; }

window.teaserReady.then(() => render(T.reveal + 6));   // poster frame before playing
const start = document.getElementById('start'), end = document.getElementById('end');
let raf = 0;
function loop() {
  const t = audio.currentTime;
  render(t);
  if (audio.ended || t >= DUR - .05) { end.classList.remove('hide'); return; }
  raf = requestAnimationFrame(loop);
}
function play() {
  start.classList.add('hide'); end.classList.add('hide');
  audio.currentTime = 0; audio.play().catch(() => {});
  cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
}
document.getElementById('play').onclick = play;
document.getElementById('replay').onclick = play;
})();
</script>
</body>
