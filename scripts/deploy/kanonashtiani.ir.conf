server {
    listen 80;
    server_name kanonashtiani.ir www.kanonashtiani.ir;

    # انتقال خودکار به HTTPS (پس از فعال‌سازی SSL توسط certbot خودکار اضافه می‌شود)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # سقف حجم آپلود فایل (تکالیف، فیش واریزی، جزوه‌ها)
        client_max_body_size 25M;

        # تایم‌اوت‌های مناسب برای فایل‌های سنگین
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
