# استقرار خودکار نسخهٔ دمو روی demo.kanonashtiani.ir (هرگز سامانهٔ اصلی)
# پیش‌نیاز (Settings → Secrets and variables → Actions) — فقط یکی از این دو لازم است:
#   DEMO_SSH_PASSWORD     رمز کاربر SSH سرور
#   DEMO_SSH_KEY          یا کلید خصوصی SSH (امن‌تر)
# اختیاری:
#   DEMO_SSH_HOST         پیش‌فرض 89.46.217.44 (docs/DEPLOYMENT.md)
#   DEMO_SSH_USER         پیش‌فرض root
#   DEMO_SSH_PORT         پیش‌فرض 22
#   DEMO_SSH_KNOWN_HOSTS  خروجی ssh-keyscan؛ اگر نباشد، کلید سرور در اولین اتصال خوانده و اثر انگشتش در لاگ چاپ می‌شود
# بدون رمز/کلید، اجرا با خطا متوقف می‌شود و کاری روی سرور انجام نمی‌دهد.
name: Deploy demo

on:
  push:
    branches: [claude/zealous-noether-ywiqoi]
  workflow_dispatch:
    inputs:
      reseed:
        description: 'بازسازی دادهٔ نمونهٔ دمو از صفر (1 = بله)'
        required: false
        default: '0'

concurrency:
  group: deploy-demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: cfg
        env:
          KEY: ${{ secrets.DEMO_SSH_KEY }}
          PASS: ${{ secrets.DEMO_SSH_PASSWORD }}
        run: |
          if [ -z "$KEY" ] && [ -z "$PASS" ]; then
            echo "::error::Secret «DEMO_SSH_PASSWORD» (یا DEMO_SSH_KEY) تنظیم نشده است؛ استقرار انجام نشد."
            echo "ready=0" >> "$GITHUB_OUTPUT"
            exit 1  # اجرا قرمز می‌شود تا «موفق» به‌اشتباه برداشت نشود
          else
            echo "ready=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Tests before deploy
        if: steps.cfg.outputs.ready == '1'
        run: |
          node --version
          node scripts/test-migrations.mjs
          node scripts/test-counselor.mjs
          node scripts/test-platform.mjs

      - name: Deploy to demo server
        if: steps.cfg.outputs.ready == '1'
        env:
          HOST: ${{ secrets.DEMO_SSH_HOST || '89.46.217.44' }}
          PASS: ${{ secrets.DEMO_SSH_PASSWORD }}
          SSH_USER: ${{ secrets.DEMO_SSH_USER || 'root' }}
          SSH_PORT: ${{ secrets.DEMO_SSH_PORT || '22' }}
          KEY: ${{ secrets.DEMO_SSH_KEY }}
          KNOWN: ${{ secrets.DEMO_SSH_KNOWN_HOSTS }}
          RESEED: ${{ github.event.inputs.reseed || '0' }}
          REV: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$KNOWN" ]; then printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" "$HOST" 2>/dev/null > ~/.ssh/known_hosts
            [ -s ~/.ssh/known_hosts ] || { echo "::error::سرور $HOST:$SSH_PORT پاسخ SSH نداد"; exit 1; }
            echo "::notice::اثر انگشت کلید سرور (با سرور مقایسه کنید):"; ssh-keygen -lf ~/.ssh/known_hosts
          fi
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/demo_key && chmod 600 ~/.ssh/demo_key
            SSH="ssh -i $HOME/.ssh/demo_key -p $SSH_PORT -o StrictHostKeyChecking=yes -o BatchMode=yes $SSH_USER@$HOST"
          else
            sudo apt-get install -y -qq sshpass >/dev/null
            export SSHPASS="$PASS"   # رمز از متغیر محیطی خوانده می‌شود، نه خط فرمان
            SSH="sshpass -e ssh -p $SSH_PORT -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no $SSH_USER@$HOST"
          fi
          SUDO=""; [ "$SSH_USER" != "root" ] && SUDO="sudo"
          INCOMING="/tmp/roshd-demo-incoming-$REV"
          git archive --format=tar HEAD | $SSH "rm -rf $INCOMING && mkdir -p $INCOMING && tar -x -C $INCOMING"
          $SSH "$SUDO env SRC=$INCOMING DEMO_REV=${REV:0:7} RESEED=$RESEED bash $INCOMING/scripts/deploy/demo/deploy-demo.sh; rc=\$?; $SUDO rm -rf $INCOMING; exit \$rc"
          rm -f ~/.ssh/demo_key

      - name: Smoke check
        if: steps.cfg.outputs.ready == '1'
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://demo.kanonashtiani.ir/api/health; then exit 0; fi
            sleep 10
          done
          echo "::warning::دمو روی HTTPS پاسخ نداد؛ رکورد DNS و گواهی SSL را بررسی کنید (سرویس روی سرور بالا آمده است)."
