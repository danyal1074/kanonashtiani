# Nginx جلوی سرور Node (HTTPS). دامنه و مسیر گواهی را عوض کنید.
upstream roshd { server 127.0.0.1:3000; keepalive 64; }

server {
  listen 80;
  server_name roshd.example.ir;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name roshd.example.ir;
  ssl_certificate     /etc/letsencrypt/live/roshd.example.ir/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/roshd.example.ir/privkey.pem;

  client_max_body_size 15m;          # رسید و فایل تکلیف (پشتیبان‌گیری از پنل مدیر سامانه را از همین سرور و با آی‌پی داخلی انجام دهید)
  proxy_read_timeout 120s;

  location / {
    proxy_pass http://roshd;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # جایگزین، نه افزودن: هدر جعلی کاربر عبور نمی‌کند
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
